name: 🚀 Deploy Website on push

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: 🎉 Deploy
    runs-on: ubuntu-latest
    steps:
    - name: 🚚 Get latest code
      uses: actions/checkout@v3

    - name: 📂 Sync files
      uses: SamKirkland/FTP-Deploy-Action@v4.3.4
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        server-dir: public_html/presensi-guru.smkicb-teknika.sch.id/

    - name: 🔧 Clear Laravel Cache via SSH
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USERNAME }}
        password: ${{ secrets.SSH_PASSWORD }}
        port: ${{ secrets.SSH_PORT }}
        script: |
          cd ~/public_html/presensi-guru.smkicb-teknika.sch.id
          # Update LEO AI env vars langsung di .env server
          sed -i '/^NUBI_AI_API_KEY/d' .env
          sed -i '/^NUBI_AI_BASE_URL/d' .env
          sed -i '/^NUBI_AI_MODEL/d' .env
          sed -i '/^LEO_AI_API_KEY/d' .env
          sed -i '/^LEO_AI_BASE_URL/d' .env
          sed -i '/^LEO_AI_MODEL/d' .env
          echo "LEO_AI_API_KEY=${{ secrets.LEO_AI_API_KEY }}" >> .env
          echo "LEO_AI_BASE_URL=https://leo-ai-proxy.vioatmajaya.workers.dev" >> .env
          echo "LEO_AI_MODEL=agnes-2.5-flash" >> .env
          php artisan config:clear
          php artisan route:clear
          php artisan view:clear
          php artisan cache:clear
          php artisan config:cache
          php artisan route:cache
